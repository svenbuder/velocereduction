[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velocereduction"
version = "0.8.0"
description = "Compact reduction pipeline for the Veloce echelle spectrograph"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "coverage>=7"]

[tool.setuptools.packages.find]
include = ["velocereduction*"]

[tool.setuptools.package-data]
velocereduction = [
    "veloce_reference_data/*",
    "wavelength_coefficients/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["velocereduction"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
